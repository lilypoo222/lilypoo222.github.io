</g>
<path id="Mouth" d="M285.143 360L295.396 348.958C296.909 347.329 299.46 347.246 301.076 348.774L316.643 363.5" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
`;

// Extruded parts: z = back of the extrusion, depth = thickness (SVG units).
// The design's own outline stroke (same colour as the fill) becomes the bevel,
// so the silhouette seen head-on matches the 2D drawing.
const SOLIDS = {
  'Tail':     { z: -6,  depth: 8 },
  'Body':     { z: -20, depth: 40 },
  'Arm Up L': { z: -5,  depth: 30 },
  'Arm Up R': { z: -5,  depth: 30 },
  'Head':     { z: -40, depth: 80 },
};
const GROUPS = ['Belly', 'Head', 'Eye L', 'Eye R'];

// Which animated part each layer belongs to, and which surface its flat details sit on.
const PART_OF = {
  'Tail': 'tail', 'Body': 'body', 'Belly': 'body',
  'Arm Up L': 'armL', 'Arm Up R': 'armR',
  'Head': 'head', 'Stitches': 'head', 'Eye L': 'head', 'Eye R': 'head', 'Mouth': 'head',
};
const PIVOTS = {
  body: [298, 577], head: [298, 440], tail: [256, 516], armL: [268, 446], armR: [328, 446],
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffffff');

const camera = new THREE.PerspectiveCamera(30, 1, 10, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.target.set(0, 255, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-400, 700, 900);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2);
rim.position.set(600, 300, -500);
scene.add(rim);

// Shadow ellipse from the design (#CCCCCC, rx 98.5), laid flat on the floor.
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(1, 96).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: '#CCCCCC' })
);
shadow.scale.set(98.5, 1, 75);
shadow.position.set(0.5, 0.1, 0);
scene.add(shadow);

// cat: world-space group (turntable sway + breathing, scaled from the feet).
// svgRoot: flips SVG's y-down coordinates and puts the bottom of the feet (y 577) on the floor.
const cat = new THREE.Group();
scene.add(cat);
const svgRoot = new THREE.Group();
svgRoot.scale.y = -1;
svgRoot.position.set(-298, 577, 0);
cat.add(svgRoot);

const parts = {};
for (const [name, [px, py]] of Object.entries(PIVOTS)) {
  const pivot = new THREE.Group();
  pivot.position.set(px, py, 0);
  const inner = new THREE.Group();
  inner.position.set(-px, -py, 0);
  pivot.add(inner);
  svgRoot.add(pivot);
  parts[name] = { pivot, inner, rest: [px, py] };
}

const solidMaterial = new THREE.MeshPhongMaterial({ color: 0x000000, specular: 0x3a3a3a, shininess: 35 });
const flatMaterials = new Map();
function flatMaterial(css) {
  if (!flatMaterials.has(css)) {
    flatMaterials.set(css, new THREE.MeshBasicMaterial({ color: new THREE.Color().setStyle(css), side: THREE.DoubleSide }));
  }
  return flatMaterials.get(css);
}

const painted = (v) => v !== undefined && v !== 'none' && v !== 'transparent';
const surfaceZ = {};   // front face z of each solid, where its details are layered
const layerZ = {};     // next free z on that surface (keeps SVG paint order)
const LAYER_STEP = 0.3;

const data = new SVGLoader().parse(CAT_SVG);
for (const path of data.paths) {
  const node = path.userData.node;
  const name = GROUPS.includes(node.parentNode.id) ? node.parentNode.id : node.id;
  const part = PART_OF[name];
  const style = path.userData.style;
  const target = parts[part].inner;

  if (SOLIDS[name] && painted(style.fill)) {
    const { z, depth } = SOLIDS[name];
    const bevel = painted(style.stroke) ? style.strokeWidth / 2 : 3;
    const geo = new THREE.ExtrudeGeometry(SVGLoader.createShapes(path), {
      depth, curveSegments: 32,
      bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4,
    });
    geo.translate(0, 0, z);
    target.add(new THREE.Mesh(geo, solidMaterial));
    surfaceZ[part] = z + depth + bevel;
    continue;
  }

  // Flat detail layers (eyes, belly, stitches, mouth, head outline) on the part's front face.
  const z0 = (layerZ[part] ?? surfaceZ[part]) + LAYER_STEP;
  if (painted(style.fill)) {
    const mesh = new THREE.Mesh(new THREE.ShapeGeometry(SVGLoader.createShapes(path), 32), flatMaterial(style.fill));
    mesh.position.z = z0;
    target.add(mesh);
  }
  if (painted(style.stroke)) {
    for (const sub of path.subPaths) {
      const geo = SVGLoader.pointsToStroke(sub.getPoints(), style);
      if (!geo) continue;
      const mesh = new THREE.Mesh(geo, flatMaterial(style.stroke));
      mesh.position.z = z0 + LAYER_STEP / 2;
      target.add(mesh);
    }
  }
  layerZ[part] = z0 + LAYER_STEP;
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const fitH = 330 / Math.tan(halfFov);
  const fitW = 230 / (Math.tan(halfFov) * camera.aspect);
  const dist = Math.max(fitH, fitW);
  camera.position.set(0, 255, dist);
  controls.minDistance = dist * 0.5;
  controls.maxDistance = dist * 2;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Idle: slow weight shift, breathing, head bob, arm sway, tail flick.
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const breath = Math.sin(t * 2.2);

  cat.rotation.y = Math.sin(t * 0.6) * 0.45;
  cat.scale.y = 1 + breath * 0.008;

  const head = parts.head;
  head.pivot.position.y = head.rest[1] + Math.sin(t * 2.2 - 0.6) * 2.5;
  head.pivot.rotation.z = Math.sin(t * 1.1) * 0.025;

  parts.armL.pivot.rotation.z = Math.sin(t * 2.2 - 0.3) * 0.035;
  parts.armR.pivot.rotation.z = -Math.sin(t * 2.2 - 0.3) * 0.035;

  parts.tail.pivot.rotation.z = Math.sin(t * 2.6) * 0.18;

  controls.update();
  renderer.render(scene, camera);
});
</script>
