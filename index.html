<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="icon" href="assets/icons/LDH-logo01.png" type="image/png">
  <link rel="stylesheet" href="assets/css/cursor.css">
  <script src="assets/js/cursor.js" defer></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- canvas: the centred 1440 frame; draws the dashed seams just outside its sides -->
  <div class="canvas">
  <!-- Figma: Portfolio_02 > Portfolio_Idea2 (1440 × 1024) -->
  <div class="home">
    <img class="home__circle" src="assets/images/circle.svg" width="1199" height="1199" alt="">
    <img class="home__grass" src="assets/images/grass-scribbles.svg" width="331" height="224" alt="">

    <main>
      <section class="hero container grid">
        <!-- hero_text_animated -->
        <h1 class="hero-text">
          <span class="hero-text__line"><span class="hero-text__word font-display">DESIGN</span> <span class="hero-text__word font-display-italic">is</span> <span class="hero-text__word font-display-italic" data-cycle="celebrating, revealing, creating, finding">celebrating</span></span>
          <span class="hero-text__line"><span class="hero-text__word font-display-italic" data-cycle="what you, who you">what you</span> <span class="hero-text__word font-display" data-cycle="LOVE, ARE">LOVE</span></span>
          <canvas class="hero-text__warp" aria-hidden="true"></canvas>
        </h1>
      </section>
    </main>

    <!-- cat_vector: the 2D cat and its shadow. Drag it up off the hill (assets/js/home-cat.js). -->
    <div class="home__cat" data-clickable>
      <div class="home__cat-shadow" aria-hidden="true"></div>
      <img class="home__cat-art" src="assets/images/2D-cat-idle.svg" width="227" height="317" alt="Black cat character">
    </div>

    <!-- new nav (Figma 2161:1198): the site's navigation, written on a notepad page at (60, 421).
         The current page's link is blue (aria-current="page"). "projects" goes to projects.html;
         "about me" and "contact" are placeholders until those pages exist. -->
    <nav class="notepad-nav" aria-label="Main">
      <img class="notepad-nav__paper" src="assets/images/notepad-paper.svg" width="317" height="533" alt="">
      <ul class="notepad-nav__links">
        <li><a href="index.html" aria-current="page">home</a></li>
        <li><a href="projects.html">projects</a></li>
        <li><a href="#">about me</a></li>
        <li><a href="#">contact</a></li>
      </ul>
      <a class="notepad-nav__cat" href="#">meet the cat</a>
    </nav>

    <!-- click_me_sticker (Figma 2168:1838) at (393, 407): the cat sticker opens the cat animations.
         "Click me!" sits on a circle around it (text on a path) and writes itself on on hover. -->
    <a class="cat-sticker" href="2D-cat-animations.html" aria-label="Click me! Open the cat animations">
      <span class="cat-sticker__badge">
        <img class="cat-sticker__cat" src="assets/images/cat-sticker.svg" width="99" height="102" alt="">
      </span>
      <svg class="cat-sticker__label" viewBox="0 0 239.72 239.72" aria-hidden="true" focusable="false">
        <!-- 228px circle around the sticker's centre, starting at the "C" and running anticlockwise -->
        <path id="cat-sticker-arc" d="M160.16 226.5A114 114 0 0 0 79.56 13.22A114 114 0 0 0 160.16 226.5" fill="none"/>
        <text><textPath href="#cat-sticker-arc">Click me!</textPath></text>
      </svg>
    </a>

    <!-- static nav: the previous nav bar along the bottom of the frame. Hidden for now (kept in
         case it comes back). -->
    <nav class="static-nav container grid" aria-label="Main" hidden>
      <ul class="static-nav__links">
        <li><a href="index.html" aria-current="page">home</a></li>
        <li><a href="projects.html">projects</a></li>
        <li><a href="#">about me</a></li>
        <li><a href="#">contact</a></li>
      </ul>
      <a class="static-nav__cat" href="#">meet the cat</a>
    </nav>

    <!-- Hand-drawn "boil" filters for the thought cloud: the same gentle wobble with four different
         noise seeds; each piece of the cloud steps between them (see .home__cloud-part in style.css). -->
    <svg class="boil-filters" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="boil-1" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="1"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
      <filter id="boil-2" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
      <filter id="boil-3" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="13"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
      <filter id="boil-4" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="21"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
    </svg>

    <!-- iwanttoplay: thought cloud -->
    <p class="home__play">
      <img class="home__cloud" src="assets/images/thinking-cloud.svg" width="224" height="236" alt="">
      <span class="home__play-word home__play-word--i-want"><span>I want</span></span>
      <span class="home__play-word home__play-word--to"><span>to</span></span>
      <span class="home__play-word home__play-word--play"><span>play!</span></span>
    </p>
  </div>
  </div>

  <script src="assets/js/main.js" defer></script>
  <script type="module" src="assets/js/hero-warp.js"></script>
  <script type="module" src="assets/js/home-cat.js"></script>
</body>
</html>
